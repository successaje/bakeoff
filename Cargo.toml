[workspace]
resolver = "2"
members = ["evaluator", "contract", "registry", "tools/mock-outlayer", "tools/mock-wnear", "tools/mock-intents", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/successaje/bakeoff"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

# The evaluator checks NEAR AI Cloud's ECDSA signatures and Intel TDX quotes in WebAssembly, where
# OutLayer meters every instruction. Size-optimized, one signature costs about 18 million
# instructions and one quote about 420 million; these crates are optimized for speed instead.
# None of them is part of the contracts' build, whose code hashes are unaffected.
[profile.release.package.k256]
opt-level = 3
[profile.release.package.p256]
opt-level = 3
[profile.release.package.ecdsa]
opt-level = 3
[profile.release.package.elliptic-curve]
opt-level = 3
[profile.release.package.crypto-bigint]
opt-level = 3
[profile.release.package.primeorder]
opt-level = 3
[profile.release.package.ff]
opt-level = 3
[profile.release.package.group]
opt-level = 3
[profile.release.package.dcap-qvl]
opt-level = 3
[profile.release.package.dcap-qvl-webpki]
opt-level = 3
[profile.release.package.der]
opt-level = 3
[profile.release.package.x509-cert]
opt-level = 3
