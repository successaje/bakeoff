[workspace]
resolver = "2"
members = ["evaluator", "contract", "tools/mock-outlayer", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/successaje/bakeoff"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
