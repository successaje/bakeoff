[package]
name = "mock-wnear"
description = "Stand-in for wrap.near, the wNEAR token, for sandbox tests of paying a winner into NEAR Intents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
