[package]
name = "bakeoff-integration-tests"
description = "Sandbox tests of the challenge contract against a mock OutLayer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
anyhow = "1"
bakeoff-evaluator = { path = "../evaluator" }
near-workspaces = "0.24"
# The versions near-workspaces uses, to build global-contract transactions it has no helper for.
near-crypto = "=0.38.0"
near-jsonrpc-client = "=0.23.0"
near-jsonrpc-primitives = "=0.38.0"
near-primitives = "=0.38.0"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
