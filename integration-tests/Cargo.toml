[package]
name = "bakeoff-integration-tests"
description = "Sandbox tests of the challenge contract against a mock OutLayer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
anyhow = "1"
