[package]
name = "bakeoff-evaluator"
description = "Sealed evaluator for Bakeoff challenges, executed inside OutLayer TEE workers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bakeoff-evaluator"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi = "0.13"
