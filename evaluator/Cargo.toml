[package]
name = "bakeoff-evaluator"
description = "Sealed evaluator for Bakeoff challenges, executed inside OutLayer TEE workers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bakeoff-evaluator"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
# Checking the model provider's TEE attestation (src/attestation.rs): Intel TDX quotes with the
# version of dcap-qvl OutLayer and the board use, minus its reqwest-based collateral client, and
# the provider's per-answer ECDSA signatures, which are Ethereum-style (EIP-191).
dcap-qvl = { version = "=0.5.2", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi = "0.13"
