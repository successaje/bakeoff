[package]
name = "quote-verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Intel TDX quote verification for the Bakeoff board, compiled to WebAssembly."

# Built on its own with wasm-pack (web/scripts/build-quote-verifier.sh), not as part of the
# repository's workspace: it only makes sense for wasm32-unknown-unknown.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The crate and version OutLayer verifies quotes with. `ring` does not build for
# wasm32-unknown-unknown, so the pure-Rust `rustcrypto` backend provides the primitives, and `js`
# is dcap-qvl's own wasm-bindgen support.
dcap-qvl = { version = "=0.5.2", default-features = false, features = ["std", "rustcrypto", "default-x509", "js"] }
# 0.2.130 emits glue that its own CLI then rejects for this crate; 0.2.126 is what OutLayer builds with.
wasm-bindgen = "=0.2.126"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
