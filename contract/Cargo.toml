[package]
name = "bakeoff-contract"
description = "Bakeoff challenge contract: requests sealed evaluations from OutLayer and records verdicts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# A reproducible build (NEP-330): `cargo near build reproducible-wasm` builds the committed source
# in this image, pinned by its digest, so anyone who builds the same commit gets the same code hash.
# The contract's `contract_source_metadata` view names the commit and this environment.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
